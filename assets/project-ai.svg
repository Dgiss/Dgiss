<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" fill="none" role="img" aria-label="AI Automation — LLM integrations and workflow automation">

  <defs>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    </style>

    <linearGradient id="ai-bg" x1="0" y1="0" x2="640" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/><stop offset="1" stop-color="#070A08"/>
    </linearGradient>
    <radialGradient id="ai-halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(490 110) scale(280 200)">
      <stop stop-color="#00FF88" stop-opacity="0.16"/><stop offset="1" stop-color="#00FF88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ai-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" stroke="#00FF88" stroke-opacity="0.06" stroke-width="1" fill="none"/>
    </pattern>
    <filter id="ai-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="220" rx="14" fill="url(#ai-bg)"/>
  <rect width="640" height="220" rx="14" fill="url(#ai-grid)"/>
  <rect width="640" height="220" rx="14" fill="url(#ai-halo)"/>
  <rect x="0.5" y="0.5" width="639" height="219" rx="14" stroke="#00FF88" stroke-opacity="0.20"/>
  <rect x="0" y="0" width="4" height="220" fill="#00FF88" fill-opacity="0.8"/>

  <!-- neural net motif : 3 → 4 → 2 -->
  <g>
    <g stroke="#00C96B" stroke-opacity="0.22" stroke-width="1">
      <path d="M412 60 L494 42"/><path d="M412 60 L494 90"/><path d="M412 60 L494 130"/><path d="M412 60 L494 178"/>
      <path d="M412 110 L494 42"/><path d="M412 110 L494 90"/><path d="M412 110 L494 130"/><path d="M412 110 L494 178"/>
      <path d="M412 160 L494 42"/><path d="M412 160 L494 90"/><path d="M412 160 L494 130"/><path d="M412 160 L494 178"/>
      <path d="M494 42 L588 84"/><path d="M494 90 L588 84"/><path d="M494 130 L588 84"/><path d="M494 178 L588 84"/>
      <path d="M494 42 L588 140"/><path d="M494 90 L588 140"/><path d="M494 130 L588 140"/><path d="M494 178 L588 140"/>
    </g>

    <g fill="#0A0C0A" stroke="#00FF88" stroke-opacity="0.55">
      <circle cx="412" cy="60" r="6"/><circle cx="412" cy="110" r="6"/><circle cx="412" cy="160" r="6"/>
      <circle cx="494" cy="42" r="6"/><circle cx="494" cy="90" r="6"/><circle cx="494" cy="130" r="6"/><circle cx="494" cy="178" r="6"/>
    </g>

    <g fill="#00FF88">
      <circle cx="412" cy="60" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="412" cy="110" r="2.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="412" cy="160" r="2.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="494" cy="42" r="2.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="494" cy="90" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="494" cy="130" r="2.5"><animate attributeName="opacity" values="1;0.4;1" dur="2.0s" repeatCount="indefinite"/></circle>
      <circle cx="494" cy="178" r="2.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.7s" repeatCount="indefinite"/></circle>
    </g>

    <circle cx="588" cy="84" r="9" fill="#00FF88" fill-opacity="0.12" filter="url(#ai-glow)"/>
    <circle cx="588" cy="84" r="4" fill="#00FF88"><animate attributeName="r" values="4;5.5;4" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="588" cy="140" r="9" fill="#00FF88" fill-opacity="0.12" filter="url(#ai-glow)"/>
    <circle cx="588" cy="140" r="4" fill="#00FF88"><animate attributeName="r" values="5.5;4;5.5" dur="2.8s" repeatCount="indefinite"/></circle>

    <circle r="2.5" fill="#00FF88">
      <animateMotion path="M412 110 L494 42 L588 84" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#00FF88">
      <animateMotion path="M412 160 L494 130 L588 140" dur="3.6s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- content -->
  <text class="mono" x="28" y="40" fill="#00FF88" font-size="11" letter-spacing="2.2" filter="url(#ai-glow)">03 — INTELLIGENT AUTOMATION</text>
  <text class="sans" x="28" y="82" fill="#FFFFFF" font-size="32" font-weight="700" letter-spacing="-0.5">AI Suite</text>
  <text class="sans" x="28" y="110" fill="#A1A1AA" font-size="13.5">LLM agents that automate real business workflows.</text>

  <g class="mono" font-size="10.5" letter-spacing="1">
    <rect x="28" y="130" width="70" height="24" rx="6" fill="#00FF88" fill-opacity="0.08" stroke="#00FF88" stroke-opacity="0.28"/>
    <text x="40" y="146" fill="#00FF88">AGENTS</text>
    <rect x="106" y="130" width="60" height="24" rx="6" fill="#00FF88" fill-opacity="0.08" stroke="#00FF88" stroke-opacity="0.28"/>
    <text x="118" y="146" fill="#00FF88">RAG</text>
    <rect x="174" y="130" width="98" height="24" rx="6" fill="#00FF88" fill-opacity="0.08" stroke="#00FF88" stroke-opacity="0.28"/>
    <text x="186" y="146" fill="#00FF88">AUTOMATION</text>
  </g>

  <text class="mono" x="28" y="182" fill="#A1A1AA" fill-opacity="0.75" font-size="11">Python · Bedrock · OpenAI · Node.js · Lambda</text>
  <g>
    <circle cx="32" cy="200" r="3" fill="#00FF88">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <text class="mono" x="44" y="204" fill="#00C96B" font-size="10.5" letter-spacing="1.4">ACTIVE R&amp;D</text>
  </g>
</svg>
