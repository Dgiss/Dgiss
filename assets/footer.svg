<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" fill="none" role="img" aria-label="Building products, not just software.">

  <defs>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    </style>

    <linearGradient id="f-bg" x1="0" y1="0" x2="1200" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/><stop offset="0.5" stop-color="#070A08"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="f-halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(600 180) scale(520 150)">
      <stop stop-color="#00FF88" stop-opacity="0.16"/><stop offset="1" stop-color="#00FF88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00FF88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FF88" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00FF88" stop-opacity="0"/>
    </linearGradient>
    <pattern id="f-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#00FF88" stroke-opacity="0.05" stroke-width="1" fill="none"/>
    </pattern>
    <filter id="f-glow" x="-50%" y="-120%" width="200%" height="340%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="180" rx="18" fill="url(#f-bg)"/>
  <rect width="1200" height="180" rx="18" fill="url(#f-grid)"/>
  <rect width="1200" height="180" rx="18" fill="url(#f-halo)"/>

  <rect x="200" y="42" width="800" height="1.5" fill="url(#f-line)"/>

  <text class="sans" x="600" y="98" fill="#FFFFFF" font-size="30" font-weight="700" text-anchor="middle" letter-spacing="-0.4">
    Building products, <tspan fill="#00FF88" filter="url(#f-glow)">not just software.</tspan>
  </text>

  <text class="mono" x="600" y="130" fill="#A1A1AA" fill-opacity="0.75" font-size="12.5" text-anchor="middle" letter-spacing="2.6">
    DRISSCHAHM.DEV · PARIS, FRANCE · OPEN TO OPPORTUNITIES
  </text>

  <g class="mono" font-size="13">
    <text x="600" y="160" fill="#00FF88" text-anchor="middle" letter-spacing="1.4">$ let's build something that ships</text>
  </g>
  <rect x="762" y="148" width="8" height="15" fill="#00FF88" filter="url(#f-glow)">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#00FF88" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <path d="M0 42 V18 A18 18 0 0 1 18 0 H42"/>
    <path d="M1158 0 H1182 A18 18 0 0 1 1200 18 V42"/>
  </g>
</svg>
