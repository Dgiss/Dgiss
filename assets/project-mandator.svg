<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" fill="none" role="img" aria-label="Mandator GED — Enterprise document management">

  <defs>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    </style>

    <linearGradient id="md-bg" x1="0" y1="0" x2="640" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/><stop offset="1" stop-color="#070A08"/>
    </linearGradient>
    <radialGradient id="md-halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(480 70) scale(300 220)">
      <stop stop-color="#00C96B" stop-opacity="0.18"/><stop offset="1" stop-color="#00C96B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="md-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" stroke="#00FF88" stroke-opacity="0.06" stroke-width="1" fill="none"/>
    </pattern>
    <filter id="md-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="220" rx="14" fill="url(#md-bg)"/>
  <rect width="640" height="220" rx="14" fill="url(#md-grid)"/>
  <rect width="640" height="220" rx="14" fill="url(#md-halo)"/>
  <rect x="0.5" y="0.5" width="639" height="219" rx="14" stroke="#00FF88" stroke-opacity="0.20"/>
  <rect x="0" y="0" width="4" height="220" fill="#00C96B" fill-opacity="0.9"/>

  <!-- document stack motif -->
  <g>
    <rect x="404" y="58" width="104" height="128" rx="8" fill="#0A0C0A" stroke="#00FF88" stroke-opacity="0.18"/>
    <rect x="422" y="46" width="104" height="128" rx="8" fill="#0A0C0A" stroke="#00FF88" stroke-opacity="0.26"/>
    <rect x="440" y="34" width="104" height="128" rx="8" fill="#080A08" stroke="#00FF88" stroke-opacity="0.5"/>

    <g stroke="#A1A1AA" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round">
      <path d="M456 60 H520"/><path d="M456 74 H512"/><path d="M456 88 H524"/><path d="M456 102 H500"/>
    </g>

    <!-- signature -->
    <path d="M456 128 c 8 -12, 14 8, 22 -2 c 8 -10, 12 10, 20 0 c 6 -6, 10 4, 16 0"
          stroke="#00FF88" stroke-width="2" fill="none" stroke-linecap="round"
          stroke-dasharray="90" filter="url(#md-glow)">
      <animate attributeName="stroke-dashoffset" values="90;0;0;90" keyTimes="0;0.4;0.85;1" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M456 142 H524" stroke="#00FF88" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- validated badge -->
    <circle cx="556" cy="152" r="15" fill="#050505" stroke="#00FF88" stroke-opacity="0.6"/>
    <path d="M549 152 l5 5 l9 -10" stroke="#00FF88" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="24" filter="url(#md-glow)">
      <animate attributeName="stroke-dashoffset" values="24;24;0;0" keyTimes="0;0.45;0.6;1" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- content -->
  <text class="mono" x="28" y="40" fill="#00FF88" font-size="11" letter-spacing="2.2" filter="url(#md-glow)">02 — DOCUMENT SYSTEM</text>
  <text class="sans" x="28" y="82" fill="#FFFFFF" font-size="32" font-weight="700" letter-spacing="-0.5">Mandator</text>
  <text class="sans" x="28" y="110" fill="#A1A1AA" font-size="13.5">Secure document workflow, signature &amp; versioning.</text>

  <g class="mono" font-size="10.5" letter-spacing="1">
    <rect x="28" y="130" width="82" height="24" rx="6" fill="#00FF88" fill-opacity="0.08" stroke="#00FF88" stroke-opacity="0.28"/>
    <text x="40" y="146" fill="#00FF88">E-SIGN</text>
    <rect x="118" y="130" width="70" height="24" rx="6" fill="#00FF88" fill-opacity="0.08" stroke="#00FF88" stroke-opacity="0.28"/>
    <text x="130" y="146" fill="#00FF88">RBAC</text>
    <rect x="196" y="130" width="88" height="24" rx="6" fill="#00FF88" fill-opacity="0.08" stroke="#00FF88" stroke-opacity="0.28"/>
    <text x="208" y="146" fill="#00FF88">VERSIONING</text>
  </g>

  <text class="mono" x="28" y="182" fill="#A1A1AA" fill-opacity="0.75" font-size="11">React · AWS · GraphQL · DynamoDB · Cognito</text>
  <g>
    <circle cx="32" cy="200" r="3" fill="#00C96B">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <text class="mono" x="44" y="204" fill="#00C96B" font-size="10.5" letter-spacing="1.4">ENTERPRISE SAAS</text>
  </g>
</svg>
