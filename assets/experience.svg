<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" fill="none" role="img" aria-label="Professional experience: Project Management 95%, Full Stack Development 90%, Flutter 90%, React and Next.js 90%, Cloud Architecture 85%, AWS Serverless 85%, AI and LLM Integration 75%">

  <defs>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .lbl  { fill: #FFFFFF; font-size: 13.5px; font-weight: 500; }
      .pct  { fill: #00FF88; font-size: 12px; text-anchor: end; }
    </style>

    <linearGradient id="e-bg" x1="0" y1="0" x2="1000" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/><stop offset="1" stop-color="#070A08"/>
    </linearGradient>
    <linearGradient id="e-fill" x1="346" y1="0" x2="898" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00C96B"/><stop offset="1" stop-color="#00FF88"/>
    </linearGradient>
    <pattern id="e-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#00FF88" stroke-opacity="0.045" stroke-width="1" fill="none"/>
    </pattern>
    <filter id="e-glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="400" rx="16" fill="url(#e-bg)"/>
  <rect width="1000" height="400" rx="16" fill="url(#e-grid)"/>
  <rect x="0.5" y="0.5" width="999" height="399" rx="16" stroke="#00FF88" stroke-opacity="0.18"/>

  <text class="mono" x="32" y="40" fill="#00FF88" font-size="13" letter-spacing="2.4" filter="url(#e-glow)">PROFESSIONAL EXPERIENCE</text>
  <text class="mono" x="968" y="40" fill="#A1A1AA" fill-opacity="0.6" font-size="11.5" letter-spacing="1.2" text-anchor="end">5+ years · shipped in production</text>
  <path d="M32 56 H968" stroke="#00FF88" stroke-opacity="0.12"/>

  <!-- reference gridlines -->
  <g stroke="#FFFFFF" stroke-opacity="0.05">
    <path d="M484 76 V366"/><path d="M622 76 V366"/><path d="M760 76 V366"/><path d="M898 76 V366"/>
  </g>

  <!-- row 1 · 95% -->
  <text class="sans lbl" x="32" y="98">Project Management</text>
  <rect x="346" y="88" width="552" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="346" y="88" width="524" height="8" rx="4" fill="url(#e-fill)"/>
  <circle cx="870" cy="92" r="4" fill="#00FF88" filter="url(#e-glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <text class="mono pct" x="968" y="97">95%</text>

  <!-- row 2 · 90% -->
  <text class="sans lbl" x="32" y="140">Full Stack Development</text>
  <rect x="346" y="130" width="552" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="346" y="130" width="497" height="8" rx="4" fill="url(#e-fill)"/>
  <circle cx="843" cy="134" r="4" fill="#00FF88" filter="url(#e-glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" begin="0.35s" repeatCount="indefinite"/>
  </circle>
  <text class="mono pct" x="968" y="139">90%</text>

  <!-- row 3 · 90% -->
  <text class="sans lbl" x="32" y="182">Flutter Development</text>
  <rect x="346" y="172" width="552" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="346" y="172" width="497" height="8" rx="4" fill="url(#e-fill)"/>
  <circle cx="843" cy="176" r="4" fill="#00FF88" filter="url(#e-glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <text class="mono pct" x="968" y="181">90%</text>

  <!-- row 4 · 90% -->
  <text class="sans lbl" x="32" y="224">React &amp; Next.js</text>
  <rect x="346" y="214" width="552" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="346" y="214" width="497" height="8" rx="4" fill="url(#e-fill)"/>
  <circle cx="843" cy="218" r="4" fill="#00FF88" filter="url(#e-glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" begin="1.05s" repeatCount="indefinite"/>
  </circle>
  <text class="mono pct" x="968" y="223">90%</text>

  <!-- row 5 · 85% -->
  <text class="sans lbl" x="32" y="266">Cloud Architecture</text>
  <rect x="346" y="256" width="552" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="346" y="256" width="469" height="8" rx="4" fill="url(#e-fill)"/>
  <circle cx="815" cy="260" r="4" fill="#00FF88" filter="url(#e-glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <text class="mono pct" x="968" y="265">85%</text>

  <!-- row 6 · 85% -->
  <text class="sans lbl" x="32" y="308">AWS Serverless</text>
  <rect x="346" y="298" width="552" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="346" y="298" width="469" height="8" rx="4" fill="url(#e-fill)"/>
  <circle cx="815" cy="302" r="4" fill="#00FF88" filter="url(#e-glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" begin="1.75s" repeatCount="indefinite"/>
  </circle>
  <text class="mono pct" x="968" y="307">85%</text>

  <!-- row 7 · 75% -->
  <text class="sans lbl" x="32" y="350">AI &amp; LLM Integration</text>
  <rect x="346" y="340" width="552" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.06"/>
  <rect x="346" y="340" width="414" height="8" rx="4" fill="url(#e-fill)"/>
  <circle cx="760" cy="344" r="4" fill="#00FF88" filter="url(#e-glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" begin="2.1s" repeatCount="indefinite"/>
  </circle>
  <text class="mono pct" x="968" y="349">75%</text>
</svg>
