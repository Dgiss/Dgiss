name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:

    runs-on: ubuntu-latest

    steps:

      - uses: Platane/snk@v3
        with:
          github_user_name: Dgiss
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00FF88&color_dots=#0a0a0a,#0d3b26,#00875a,#00C96B,#00FF88

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}